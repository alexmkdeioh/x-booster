<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>X Token Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #e7e9ea;
    }
    h2 {
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      color: #fff;
    }
    .badge {
      background: #1d9bf0;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .card {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      color: #71767b;
      margin-bottom: 4px;
      display: block;
      font-weight: 500;
    }
    .token-preview {
      font-family: monospace;
      font-size: 11px;
      color: #00ba7c;
      word-break: break-all;
      margin-bottom: 8px;
      background: #000;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #222;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary {
      flex: 1;
      background: #1d9bf0;
      color: white;
    }
    .btn-secondary {
      background: #2f3336;
      color: #eff3f4;
    }
    .btn-download {
      width: 100%;
      background: #00ba7c;
      color: white;
      padding: 10px;
      margin-top: 6px;
      font-size: 13px;
    }
    .btn-danger {
      background: #222;
      color: #f4212e;
      font-size: 11px;
      padding: 4px 8px;
    }
    .saved-section {
      margin-top: 10px;
    }
    .saved-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      height: 90px;
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 6px;
      color: #eff3f4;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      resize: none;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      min-height: 16px;
      text-align: center;
    }
    .status.success { color: #00ba7c; }
    .status.error { color: #f4212e; }
  </style>
</head>
<body>
  <h2>
    <span>X Token Collector</span>
    <span class="badge" id="tokenCount">0 Saved</span>
  </h2>

  <!-- Current Active Token -->
  <div class="card">
    <label>Current Logged-in Token:</label>
    <div class="token-preview" id="currentToken">Detecting...</div>
    <div class="btn-row">
      <button class="btn-primary" id="addBtn">+ Save Token to List</button>
      <button class="btn-secondary" id="copyCurrentBtn">Copy</button>
    </div>
  </div>

  <!-- Saved Tokens List -->
  <div class="saved-section">
    <div class="saved-header">
      <label>Saved Tokens (tokens.txt preview):</label>
      <button class="btn-danger" id="clearBtn">Clear All</button>
    </div>
    <textarea id="tokensList" readonly placeholder="Saved tokens will appear here..."></textarea>
  </div>

  <!-- Actions -->
  <button class="btn-download" id="downloadBtn">📥 Download tokens.txt</button>
  <button class="btn-secondary" style="width: 100%; margin-top: 6px;" id="copyAllTokensBtn">📋 Copy All Tokens</button>

  <div class="status" id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
